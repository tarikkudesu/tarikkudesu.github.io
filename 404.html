<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>404 - Page Not Found</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				text-align: center;
				padding: 50px;
				background-color: #f5f5f5;
			}

			h1 {
				font-size: 72px;
				color: #333;
				margin: 0;
			}

			h2 {
				font-size: 24px;
				color: #666;
				margin: 20px 0;
			}

			p {
				font-size: 16px;
				color: #888;
				margin-bottom: 30px;
			}

			a {
				color: #007bff;
				text-decoration: none;
				font-size: 18px;
			}

			a:hover {
				text-decoration: underline;
			}
		</style>
	</head>
	<body>
		<h1>404</h1>
		<h2>Page Not Found</h2>
		<p>The page you're looking for doesn't exist.</p>
		<a href="/">Go Home</a>
	</body>
</html>
